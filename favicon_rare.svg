<svg xmlns="http://www.w3.org/2000/svg" viewBox="307 75 260 260" width="100%" height="100%">
    <defs>
        <!-- Liquid Chrome Gradient (Ultra Glossy, Multi-Stop) -->
        <linearGradient id="chrome-fill" x1="20%" y1="10%" x2="80%" y2="90%">
            <stop offset="0%" stop-color="#2d3033"/>
            <stop offset="8%" stop-color="#ffffff"/>
            <stop offset="16%" stop-color="#a6acb0"/>
            <stop offset="28%" stop-color="#484c4f"/>
            <stop offset="38%" stop-color="#ffffff"/>
            <stop offset="52%" stop-color="#b6bcbf"/>
            <stop offset="65%" stop-color="#282a2c"/>
            <stop offset="78%" stop-color="#ffffff"/>
            <stop offset="88%" stop-color="#898e92"/>
            <stop offset="100%" stop-color="#1e2021"/>
        </linearGradient>

        <!-- Chrome Bevel Stroke Gradient -->
        <linearGradient id="chrome-stroke" x1="20%" y1="10%" x2="80%" y2="90%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="20%" stop-color="#7e8386" stop-opacity="0.4"/>
            <stop offset="40%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="60%" stop-color="#4e5254" stop-opacity="0.3"/>
            <stop offset="80%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#3e4142" stop-opacity="0.8"/>
        </linearGradient>

        <!-- High-Fidelity 3D Shadow for Monogram and Text -->
        <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.95"/>
            <feDropShadow dx="2" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.7"/>
        </filter>

        <!-- Blue Glow Radial Gradient for Background Aura -->
        <radialGradient id="blue-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0080ff" stop-opacity="0.75"/>
            <stop offset="35%" stop-color="#0040ff" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <!-- Blue Square Fill Gradient -->
        <linearGradient id="blue-square-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c6e7ff"/>
            <stop offset="30%" stop-color="#3fa2ff"/>
            <stop offset="70%" stop-color="#0055ff"/>
            <stop offset="100%" stop-color="#0011aa"/>
        </linearGradient>
    </defs>

    <!-- Squircle dark background for perfect tab contrast -->
    <rect x="307" y="75" width="260" height="260" rx="48" fill="#060608"/>

    <!-- Ambient Glow Group -->
    <g id="Ambient-Glow">
        <circle cx="340" cy="245" r="120" fill="url(#blue-glow)"/>
    </g>

    <!-- Monogram Main Group -->
    <g id="Monogram" filter="url(#drop-shadow)">
        <!-- 1. The Monogram Main R (Loop + Leg) -->
        <path d="M 353 79 
                 H 452 
                 C 502 79, 542 119, 542 169 
                 C 542 219, 502 259, 452 259 
                 C 440 259, 428 255, 418 248
                 L 499 329
                 L 527 301
                 L 435 209
                 C 455 209, 482 191, 482 169
                 C 482 147, 455 129, 435 129
                 H 393
                 Z" 
              fill="url(#chrome-fill)" 
              stroke="url(#chrome-stroke)" 
              stroke-width="2.2" 
              stroke-linejoin="round"/>

        <!-- 2. The Left Wedge Triangle -->
        <path d="M 338 122 
                 V 208 
                 H 424 
                 Z" 
              fill="url(#chrome-fill)" 
              stroke="url(#chrome-stroke)" 
              stroke-width="2.2" 
              stroke-linejoin="round"/>
    </g>

    <!-- Glowing Blue Square Group -->
    <g id="Blue-Square">
        <rect x="331" y="238" width="18" height="18" rx="3" fill="none" stroke="#0080ff" stroke-width="2.5" opacity="0.4" filter="url(#drop-shadow)"/>
        <rect x="333" y="240" width="14" height="14" rx="2" fill="url(#blue-square-grad)" stroke="#dff3ff" stroke-width="1.5"/>
    </g>
</svg>
